name: Verify CI Passed
description: Verifies that CI has passed for a given commit before deploying.

inputs:
  ref:
    description: 'Git ref to verify CI against (commit SHA, branch, or tag)'
    required: true
  poll_interval:
    description: 'Seconds between CI status checks'
    required: false
    default: '10'
  max_attempts:
    description: 'Maximum number of polling attempts'
    required: false
    default: '60'
  max_not_found:
    description: 'Maximum consecutive "not found" results before failing'
    required: false
    default: '6'

outputs:
  sha:
    description: 'Resolved commit SHA that CI was verified against'
    value: ${{ steps.verify.outputs.sha }}

runs:
  using: composite
  steps:
    - name: Verify CI passed
      id: verify
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        CI_POLL_INTERVAL: ${{ inputs.poll_interval }}
        CI_MAX_ATTEMPTS: ${{ inputs.max_attempts }}
        CI_MAX_NOT_FOUND: ${{ inputs.max_not_found }}
        REF: ${{ inputs.ref }}
        REPO: ${{ github.repository }}
      run: |
        # Resolve the ref to a commit SHA
        if ! TARGET_SHA=$(gh api "repos/${REPO}/commits/${REF}" --jq '.sha'); then
          echo "::error::Failed to resolve ref '${REF}'"
          exit 1
        fi
        if [ -z "$TARGET_SHA" ]; then
          echo "::error::Resolved SHA is empty for ref '${REF}'"
          exit 1
        fi
        
        # Warn about mutable refs (branch names) that could cause race conditions
        if [[ "$REF" == "main" || "$REF" == "master" || "$REF" =~ ^refs/heads/ ]]; then
          echo "::warning::Using branch name '${REF}' may result in race conditions if new commits are pushed. Prefer explicit commit SHAs for deterministic deploys."
        fi
        
        echo "Resolved ref '${REF}' to commit ${TARGET_SHA}"
        echo "sha=${TARGET_SHA}" >> "$GITHUB_OUTPUT"
        echo "Verifying CI has passed for commit ${TARGET_SHA}..."

        NOT_FOUND_COUNT=0
        TOTAL_NOT_FOUND=0

        for i in $(seq 1 "$CI_MAX_ATTEMPTS"); do
          RESULT=$(gh run list --workflow=CI --commit="${TARGET_SHA}" --limit=1 --json conclusion \
            | jq -r '.[0].conclusion // empty')

          if [ -z "$RESULT" ]; then
            NOT_FOUND_COUNT=$((NOT_FOUND_COUNT + 1))
            TOTAL_NOT_FOUND=$((TOTAL_NOT_FOUND + 1))
            if [ "$NOT_FOUND_COUNT" -ge "$CI_MAX_NOT_FOUND" ]; then
              echo "::error::No CI run found for commit ${TARGET_SHA} after ${CI_MAX_NOT_FOUND} consecutive attempts (total not-found: ${TOTAL_NOT_FOUND}). This commit may not have had CI run against it, or the CI run may have been garbage-collected (runs are retained ~90 days)."
              exit 1
            fi
            echo "CI run not found yet, waiting... (attempt $i/$CI_MAX_ATTEMPTS, consecutive not-found: $NOT_FOUND_COUNT/$CI_MAX_NOT_FOUND)"
            # Add jitter (0-5 seconds) to prevent API rate limiting when multiple deploys run concurrently
            JITTER=$((RANDOM % 6))
            sleep "$((CI_POLL_INTERVAL + JITTER))"
            continue
          fi

          # Reset consecutive not-found counter when we find a run (but keep total for observability)
          NOT_FOUND_COUNT=0

          if [ "$RESULT" = "success" ]; then
            if [ "$TOTAL_NOT_FOUND" -gt 0 ]; then
              echo "::notice::CI passed for this commit (encountered ${TOTAL_NOT_FOUND} intermittent not-found responses)"
            else
              echo "::notice::CI passed for this commit"
            fi
            exit 0
          elif [ "$RESULT" = "failure" ] || [ "$RESULT" = "cancelled" ]; then
            echo "::error::CI failed or was cancelled for this commit"
            exit 1
          fi

          echo "CI still running (status: $RESULT), waiting... (attempt $i/$CI_MAX_ATTEMPTS)"
          # Add jitter to in-progress polling as well
          JITTER=$((RANDOM % 6))
          sleep "$((CI_POLL_INTERVAL + JITTER))"
        done
        echo "::error::Timeout waiting for CI to complete (total not-found responses: ${TOTAL_NOT_FOUND})"
        exit 1
