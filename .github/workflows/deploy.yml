name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  actions: read
  deployments: write

concurrency:
  # Staging: single group to serialize all staging deploys
  # Production: single group to serialize all production deploys
  # workflow_dispatch: use selected environment
  group: >-
    deploy-${{
      github.event_name == 'workflow_run' && 'staging'
      || github.event_name == 'release' && 'production'
      || github.event.inputs.environment
      || 'staging'
    }}
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    # workflow_run: automatic deploy after CI succeeds
    # workflow_dispatch: manual escape hatch - bypasses CI verification intentionally
    #   Use for emergencies when you need to deploy without waiting for CI
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment:
      name: staging
      url: https://rental-studio-staging.bitcraftapps.dev

    steps:
      - name: Log deployment info
        run: |
          echo "Deploying to: staging"
          echo "Commit: ${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "Triggered by: ${{ github.event_name }}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # For workflow_run events, checkout the exact commit that triggered CI
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DOKKU_SSH_KEY }}" > ~/.ssh/dokku_deploy
          chmod 600 ~/.ssh/dokku_deploy
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Dokku (Staging)
        run: |
          git remote add dokku dokku@${{ secrets.HETZNER_HOST }}:rental-studio-staging
          GIT_SSH_COMMAND="ssh -i ~/.ssh/dokku_deploy" git push dokku HEAD:main --force

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment:
      name: production
      url: https://rental-studio.bitcraftapps.dev

    steps:
      - name: Log deployment info
        run: |
          echo "Deploying to: production"
          echo "Triggered by: ${{ github.event_name }}"
          echo "Release tag: ${{ github.event.release.tag_name || 'N/A' }}"

      - name: Verify CI passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # For releases, resolve the tag to its actual commit SHA via GitHub API
          # (target_commitish is often the branch name, not the SHA)
          if [ "${{ github.event_name }}" = "release" ]; then
            TARGET_SHA=$(gh api repos/${{ github.repository }}/git/ref/tags/${{ github.event.release.tag_name }} --jq '.object.sha')
            echo "Resolved tag ${{ github.event.release.tag_name }} to commit ${TARGET_SHA}"
          else
            TARGET_SHA=${{ github.sha }}
          fi
          echo "Verifying CI has passed for commit ${TARGET_SHA}..."
          # Wait up to 5 minutes for CI to complete if still running
          for i in {1..30}; do
            RESULT=$(gh run list --workflow=CI --commit="${TARGET_SHA}" --limit=1 --json conclusion \
              | jq -r '.[0].conclusion // empty')
            if [ "$RESULT" = "success" ]; then
              echo "CI passed for this commit"
              exit 0
            elif [ "$RESULT" = "failure" ] || [ "$RESULT" = "cancelled" ]; then
              echo "CI failed or was cancelled for this commit"
              exit 1
            fi
            echo "CI still running or not found, waiting... (attempt $i/30)"
            sleep 10
          done
          echo "Timeout waiting for CI to complete"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DOKKU_SSH_KEY }}" > ~/.ssh/dokku_deploy
          chmod 600 ~/.ssh/dokku_deploy
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Dokku (Production)
        run: |
          git remote add dokku dokku@${{ secrets.HETZNER_HOST }}:rental-studio
          GIT_SSH_COMMAND="ssh -i ~/.ssh/dokku_deploy" git push dokku HEAD:main --force
