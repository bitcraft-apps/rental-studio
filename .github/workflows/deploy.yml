name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      ref:
        description: 'Git ref to deploy (commit SHA, branch, or tag). Defaults to HEAD of main.'
        required: false
        type: string
      skip_ci_verification:
        description: 'Skip CI verification (EMERGENCY USE ONLY - for staging)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  deployments: write

concurrency:
  # Staging: cancel-in-progress to always deploy latest (avoids out-of-order deploys from workflow_run race)
  # Production: serialize deploys (cancel-in-progress: false) for safety
  group: >-
    deploy-${{
      github.event_name == 'workflow_run' && 'staging'
      || github.event_name == 'release' && 'production'
      || github.event.inputs.environment
      || 'staging'
    }}
  cancel-in-progress: ${{ github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging') }}

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    # workflow_run: automatic deploy after CI succeeds on main
    # workflow_dispatch: verifies CI unless skip_ci_verification is explicitly set
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment:
      name: staging
      url: https://rental-studio-staging.bitcraftapps.dev
    env:
      CI_POLL_INTERVAL: 10
      CI_MAX_ATTEMPTS: 60
      CI_MAX_NOT_FOUND: 6

    steps:
      - name: Verify CI passed
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.skip_ci_verification != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Staging deploy triggered by: workflow_dispatch"
          
          # Resolve the commit SHA to verify CI against
          if [ -n "${{ inputs.ref }}" ]; then
            REF="${{ inputs.ref }}"
          else
            REF="${{ github.sha }}"
          fi

          TARGET_SHA=$(gh api "repos/${{ github.repository }}/commits/${REF}" --jq '.sha' 2>&1) || {
            echo "::error::Failed to resolve ref '${REF}': ${TARGET_SHA}"
            exit 1
          }
          if [ -z "$TARGET_SHA" ]; then
            echo "::error::Resolved SHA is empty for ref '${REF}'"
            exit 1
          fi
          echo "Resolved ref '${REF}' to commit ${TARGET_SHA}"
          echo "Verifying CI has passed for commit ${TARGET_SHA}..."

          NOT_FOUND_COUNT=0

          for i in $(seq 1 $CI_MAX_ATTEMPTS); do
            RESULT=$(gh run list --workflow=CI --commit="${TARGET_SHA}" --limit=1 --json conclusion \
              | jq -r '.[0].conclusion // empty')

            if [ -z "$RESULT" ]; then
              NOT_FOUND_COUNT=$((NOT_FOUND_COUNT + 1))
              if [ $NOT_FOUND_COUNT -ge $CI_MAX_NOT_FOUND ]; then
                echo "::error::No CI run found for commit ${TARGET_SHA} after ${CI_MAX_NOT_FOUND} attempts. This commit may not have had CI run against it, or the CI run may have been garbage-collected (runs are retained ~90 days)."
                exit 1
              fi
              echo "CI run not found yet, waiting... (attempt $i/$CI_MAX_ATTEMPTS, not found count: $NOT_FOUND_COUNT/$CI_MAX_NOT_FOUND)"
              sleep $CI_POLL_INTERVAL
              continue
            fi

            NOT_FOUND_COUNT=0

            if [ "$RESULT" = "success" ]; then
              echo "::notice::CI passed for this commit"
              exit 0
            elif [ "$RESULT" = "failure" ] || [ "$RESULT" = "cancelled" ]; then
              echo "::error::CI failed or was cancelled for this commit"
              exit 1
            fi

            echo "CI still running (status: $RESULT), waiting... (attempt $i/$CI_MAX_ATTEMPTS)"
            sleep $CI_POLL_INTERVAL
          done
          echo "::error::Timeout waiting for CI to complete"
          exit 1

      - name: Warn about CI bypass
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.skip_ci_verification == 'true'
        run: |
          echo "::warning::BYPASSING CI VERIFICATION - This is a manual emergency deploy. Ensure you have verified the code manually."

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref || github.sha }}

      - name: Log deployment info
        run: |
          echo "Deploying to: staging"
          echo "Commit: $(git rev-parse HEAD)"
          echo "Commit message: $(git log -1 --format='%s')"
          echo "Triggered by: ${{ github.event_name }}"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          (umask 077 && echo "${{ secrets.DOKKU_SSH_KEY }}" > ~/.ssh/dokku_deploy)
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Dokku (Staging)
        run: |
          git remote add dokku dokku@${{ secrets.HETZNER_HOST }}:rental-studio-staging
          if ! GIT_SSH_COMMAND="ssh -i ~/.ssh/dokku_deploy" git push dokku HEAD:main --force 2>&1; then
            echo "::error::Deployment to staging failed"
            exit 1
          fi
          echo "::notice::Deployment to staging completed successfully"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    # release: automatic deploy after release is published (verifies CI passed)
    # workflow_dispatch: manual deploy with CI verification
    if: |
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment:
      name: production
      url: https://rental-studio.bitcraftapps.dev
    env:
      CI_POLL_INTERVAL: 10
      CI_MAX_ATTEMPTS: 60
      CI_MAX_NOT_FOUND: 6

    steps:
      - name: Verify CI passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Production deploy triggered by: ${{ github.event_name }}"
          echo "Target ref: ${{ github.event.release.tag_name || inputs.ref || 'default (github.sha)' }}"

          # Resolve the commit SHA to verify CI against
          # Uses commits endpoint - works for tags, branches, and SHAs
          if [ "${{ github.event_name }}" = "release" ]; then
            REF="${{ github.event.release.tag_name }}"
          elif [ -n "${{ inputs.ref }}" ]; then
            REF="${{ inputs.ref }}"
          else
            REF="${{ github.sha }}"
          fi

          TARGET_SHA=$(gh api "repos/${{ github.repository }}/commits/${REF}" --jq '.sha' 2>&1) || {
            echo "::error::Failed to resolve ref '${REF}': ${TARGET_SHA}"
            exit 1
          }
          if [ -z "$TARGET_SHA" ]; then
            echo "::error::Resolved SHA is empty for ref '${REF}'"
            exit 1
          fi
          echo "Resolved ref '${REF}' to commit ${TARGET_SHA}"
          echo "Verifying CI has passed for commit ${TARGET_SHA}..."

          NOT_FOUND_COUNT=0

          for i in $(seq 1 $CI_MAX_ATTEMPTS); do
            RESULT=$(gh run list --workflow=CI --commit="${TARGET_SHA}" --limit=1 --json conclusion \
              | jq -r '.[0].conclusion // empty')

            if [ -z "$RESULT" ]; then
              NOT_FOUND_COUNT=$((NOT_FOUND_COUNT + 1))
              if [ $NOT_FOUND_COUNT -ge $CI_MAX_NOT_FOUND ]; then
                echo "::error::No CI run found for commit ${TARGET_SHA} after ${CI_MAX_NOT_FOUND} attempts. This commit may not have had CI run against it, or the CI run may have been garbage-collected (runs are retained ~90 days)."
                exit 1
              fi
              echo "CI run not found yet, waiting... (attempt $i/$CI_MAX_ATTEMPTS, not found count: $NOT_FOUND_COUNT/$CI_MAX_NOT_FOUND)"
              sleep $CI_POLL_INTERVAL
              continue
            fi

            # Reset not found counter if we find a run
            NOT_FOUND_COUNT=0

            if [ "$RESULT" = "success" ]; then
              echo "::notice::CI passed for this commit"
              exit 0
            elif [ "$RESULT" = "failure" ] || [ "$RESULT" = "cancelled" ]; then
              echo "::error::CI failed or was cancelled for this commit"
              exit 1
            fi

            echo "CI still running (status: $RESULT), waiting... (attempt $i/$CI_MAX_ATTEMPTS)"
            sleep $CI_POLL_INTERVAL
          done
          echo "::error::Timeout waiting for CI to complete"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.ref || github.sha }}

      - name: Log deployment info
        run: |
          echo "Deploying to: production"
          echo "Commit: $(git rev-parse HEAD)"
          echo "Commit message: $(git log -1 --format='%s')"
          echo "Triggered by: ${{ github.event_name }}"
          echo "Release tag: ${{ github.event.release.tag_name || 'N/A' }}"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          (umask 077 && echo "${{ secrets.DOKKU_SSH_KEY }}" > ~/.ssh/dokku_deploy)
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Dokku (Production)
        run: |
          git remote add dokku dokku@${{ secrets.HETZNER_HOST }}:rental-studio
          if ! GIT_SSH_COMMAND="ssh -i ~/.ssh/dokku_deploy" git push dokku HEAD:main --force 2>&1; then
            echo "::error::Deployment to production failed"
            exit 1
          fi
          echo "::notice::Deployment to production completed successfully"
