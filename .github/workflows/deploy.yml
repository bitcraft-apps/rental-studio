name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      ref:
        description: 'Git ref to deploy (commit SHA, branch, or tag). Defaults to HEAD of main.'
        required: false
        type: string
      skip_ci_verification:
        description: 'Skip CI verification (EMERGENCY USE ONLY - for staging)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  deployments: write

concurrency:
  # Staging: cancel-in-progress to always deploy latest (avoids out-of-order deploys from workflow_run race)
  # Production: serialize deploys (cancel-in-progress: false) for safety
  #
  # NOTE: workflow_run can still have race conditions if deploys complete out-of-order after
  # passing concurrency control. This is an inherent limitation - for critical deployments,
  # use workflow_dispatch with explicit commit SHA.
  group: >-
    deploy-${{
      (github.event_name == 'workflow_run' && 'staging') ||
      (github.event_name == 'release' && 'production') ||
      github.event.inputs.environment ||
      'staging'
    }}
  cancel-in-progress: ${{ github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging') }}

jobs:
  # Observability: Log when deploy is skipped due to CI failure
  log-ci-failure:
    name: Log CI Failure
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'
    steps:
      - name: Log deploy skipped
        run: |
          echo "::warning::Deploy to staging skipped because CI ${{ github.event.workflow_run.conclusion }} for commit ${{ github.event.workflow_run.head_sha }}"
          {
            echo "## Deploy Skipped"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Reason | CI ${{ github.event.workflow_run.conclusion }} |"
            echo "| Commit | \`${{ github.event.workflow_run.head_sha }}\` |"
            echo "| Branch | ${{ github.event.workflow_run.head_branch }} |"
            echo "| CI Run | [View Run](${{ github.event.workflow_run.html_url }}) |"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    # workflow_run: automatic deploy after CI succeeds on main
    # workflow_dispatch: verifies CI unless skip_ci_verification is explicitly set
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment:
      name: staging
      url: https://rental-studio-staging.bitcraftapps.dev

    steps:
      # For workflow_run, CI success is guaranteed by the job-level if condition
      - name: Set deploy SHA (workflow_run)
        id: workflow-run-sha
        if: github.event_name == 'workflow_run'
        run: echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

      # Sparse checkout to minimize checkout time - only need .github/actions for verify-ci.
      # If the action requires additional files, expand sparse-checkout patterns accordingly.
      - name: Checkout (for verify-ci action)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.skip_ci_verification != 'true'
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - name: Verify CI passed
        id: verify-ci
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.skip_ci_verification != 'true'
        uses: ./.github/actions/verify-ci
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Resolve SHA (skip verification path)
        id: skip-verify-sha
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.skip_ci_verification == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REF="${{ inputs.ref || github.sha }}"
          if ! SHA=$(gh api "repos/${{ github.repository }}/commits/${REF}" --jq '.sha'); then
            echo "::error::Failed to resolve ref '${REF}'"
            exit 1
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Warn about CI bypass
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.skip_ci_verification == 'true'
        run: |
          echo "::warning::BYPASSING CI VERIFICATION - This is a manual emergency deploy. Ensure you have verified the code manually."

      - name: Validate resolved SHA
        id: validate-sha
        env:
          SHA: ${{ steps.workflow-run-sha.outputs.sha || steps.verify-ci.outputs.sha || steps.skip-verify-sha.outputs.sha }}
        run: |
          if [ -z "$SHA" ]; then
            echo "::error::No SHA resolved from any verification path. This is a bug in workflow logic."
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Use resolved SHA to prevent TOCTOU issues when ref is a branch name
          ref: ${{ steps.validate-sha.outputs.sha }}
          # Full clone required - Dokku rejects shallow pushes
          fetch-depth: 0

      - name: Log deployment info
        run: |
          COMMIT_SHA=$(git rev-parse HEAD)
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --format='%s')
          # Escape pipe characters to prevent breaking markdown table
          SAFE_MSG=$(echo "$COMMIT_MSG" | sed 's/|/\\|/g')
          
          echo "Deploying to: staging"
          echo "Commit: $COMMIT_SHA"
          echo "Commit message: $COMMIT_MSG"
          echo "Triggered by: ${{ github.event_name }}"
          echo "CI Verification: ${{ github.event.inputs.skip_ci_verification == 'true' && 'BYPASSED' || 'Passed' }}"
          
          {
            echo "## Deployment Info"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Environment | staging |"
            echo "| Commit | \`$COMMIT_SHORT\` |"
            echo "| Message | $SAFE_MSG |"
            echo "| Triggered by | ${{ github.event_name }} |"
            echo "| CI Verification | ${{ github.event.inputs.skip_ci_verification == 'true' && 'BYPASSED ⚠️' || 'Passed ✅' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup SSH
        uses: ./.github/actions/setup-dokku-ssh
        with:
          ssh_key: ${{ secrets.DOKKU_SSH_KEY }}
          known_hosts: ${{ secrets.DOKKU_KNOWN_HOSTS }}

      - name: Deploy to Dokku (Staging)
        run: |
          git remote add dokku dokku@${{ secrets.HETZNER_HOST }}:rental-studio-staging || true
          # Use full refspec for first push (when remote branch doesn't exist yet)
          if ! OUTPUT=$(GIT_SSH_COMMAND="ssh -i ~/.ssh/dokku_deploy" git push dokku HEAD:refs/heads/main --force 2>&1); then
            echo "::error::Deployment to staging failed: ${OUTPUT}"
            exit 1
          fi
          echo "$OUTPUT"
          echo "::notice::Deployment to staging completed successfully"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    # release: automatic deploy after release is published (verifies CI passed)
    # workflow_dispatch: manual deploy with CI verification
    if: |
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment:
      name: production
      url: https://rental-studio.bitcraftapps.dev

    steps:
      # Sparse checkout to minimize checkout time - only need .github/actions for verify-ci.
      # If the action requires additional files, expand sparse-checkout patterns accordingly.
      - name: Checkout (for verify-ci action)
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - name: Verify CI passed
        id: verify-ci
        uses: ./.github/actions/verify-ci
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref || github.sha }}

      - name: Validate resolved SHA
        id: validate-sha
        env:
          SHA: ${{ steps.verify-ci.outputs.sha }}
        run: |
          if [ -z "$SHA" ]; then
            echo "::error::No SHA resolved from CI verification. This is a bug in workflow logic."
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Use resolved SHA to prevent TOCTOU issues when ref is a tag/branch name
          ref: ${{ steps.validate-sha.outputs.sha }}
          # Full clone required - Dokku rejects shallow pushes
          fetch-depth: 0

      - name: Log deployment info
        run: |
          COMMIT_SHA=$(git rev-parse HEAD)
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --format='%s')
          # Escape pipe characters to prevent breaking markdown table
          SAFE_MSG=$(echo "$COMMIT_MSG" | sed 's/|/\\|/g')
          RELEASE_TAG="${{ github.event.release.tag_name || 'N/A' }}"
          
          echo "Deploying to: production"
          echo "Commit: $COMMIT_SHA"
          echo "Commit message: $COMMIT_MSG"
          echo "Triggered by: ${{ github.event_name }}"
          echo "Release tag: $RELEASE_TAG"
          
          {
            echo "## Deployment Info"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Environment | production |"
            echo "| Commit | \`$COMMIT_SHORT\` |"
            echo "| Message | $SAFE_MSG |"
            echo "| Triggered by | ${{ github.event_name }} |"
            echo "| Release tag | $RELEASE_TAG |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup SSH
        uses: ./.github/actions/setup-dokku-ssh
        with:
          ssh_key: ${{ secrets.DOKKU_SSH_KEY }}
          known_hosts: ${{ secrets.DOKKU_KNOWN_HOSTS }}

      - name: Deploy to Dokku (Production)
        run: |
          git remote add dokku dokku@${{ secrets.HETZNER_HOST }}:rental-studio || true
          # Use full refspec for first push (when remote branch doesn't exist yet)
          if ! OUTPUT=$(GIT_SSH_COMMAND="ssh -i ~/.ssh/dokku_deploy" git push dokku HEAD:refs/heads/main --force 2>&1); then
            echo "::error::Deployment to production failed: ${OUTPUT}"
            exit 1
          fi
          echo "$OUTPUT"
          echo "::notice::Deployment to production completed successfully"
