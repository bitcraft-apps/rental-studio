name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-${{ github.event.workflow_run.head_sha || github.event_name == 'release' && 'production' || github.event.inputs.environment || 'staging' }}
  cancel-in-progress: true

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment:
      name: staging
      url: https://rental-studio-staging.bitcraftapps.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # For workflow_run events, checkout the exact commit that triggered CI
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DOKKU_SSH_KEY }}" > ~/.ssh/dokku_deploy
          chmod 600 ~/.ssh/dokku_deploy
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Dokku (Staging)
        run: |
          git remote add dokku dokku@${{ secrets.HETZNER_HOST }}:rental-studio-staging
          GIT_SSH_COMMAND="ssh -i ~/.ssh/dokku_deploy" git push dokku HEAD:main --force

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment:
      name: production
      url: https://rental-studio.bitcraftapps.dev

    steps:
      - name: Verify CI passed
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Verifying CI has passed for commit ${{ github.sha }}..."
          # Wait up to 5 minutes for CI to complete if still running
          for i in {1..30}; do
            RESULT=$(gh run list --workflow=CI --branch=main --limit=10 --json conclusion,headSha \
              | jq -r '.[] | select(.headSha == "${{ github.sha }}") | .conclusion')
            if [ "$RESULT" = "success" ]; then
              echo "CI passed for this commit"
              exit 0
            elif [ "$RESULT" = "failure" ] || [ "$RESULT" = "cancelled" ]; then
              echo "CI failed or was cancelled for this commit"
              exit 1
            fi
            echo "CI still running or not found, waiting... (attempt $i/30)"
            sleep 10
          done
          echo "Timeout waiting for CI to complete"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DOKKU_SSH_KEY }}" > ~/.ssh/dokku_deploy
          chmod 600 ~/.ssh/dokku_deploy
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Dokku (Production)
        run: |
          git remote add dokku dokku@${{ secrets.HETZNER_HOST }}:rental-studio
          GIT_SSH_COMMAND="ssh -i ~/.ssh/dokku_deploy" git push dokku HEAD:main --force
