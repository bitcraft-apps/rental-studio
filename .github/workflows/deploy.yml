name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      ref:
        description: "Git ref to deploy (commit SHA, branch, or tag). Defaults to HEAD of main."
        required: false
        type: string

permissions:
  contents: read
  actions: read
  deployments: write

concurrency:
  # Staging: single group to serialize all staging deploys
  # Production: single group to serialize all production deploys
  # workflow_dispatch: use selected environment
  group: >-
    deploy-${{
      github.event_name == 'workflow_run' && 'staging'
      || github.event_name == 'release' && 'production'
      || github.event.inputs.environment
      || 'staging'
    }}
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    # workflow_run: automatic deploy after CI succeeds on main
    # workflow_dispatch: manual deploy - no CI verification (escape hatch for emergencies)
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment:
      name: staging
      url: https://rental-studio-staging.bitcraftapps.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref || github.sha }}

      - name: Log deployment info
        run: |
          echo "Deploying to: staging"
          echo "Commit: $(git rev-parse HEAD)"
          echo "Commit message: $(git log -1 --format='%s')"
          echo "Triggered by: ${{ github.event_name }}"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DOKKU_SSH_KEY }}" > ~/.ssh/dokku_deploy
          chmod 600 ~/.ssh/dokku_deploy
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Dokku (Staging)
        run: |
          git remote add dokku dokku@${{ secrets.HETZNER_HOST }}:rental-studio-staging
          GIT_SSH_COMMAND="ssh -i ~/.ssh/dokku_deploy" git push dokku HEAD:main --force

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    # release: automatic deploy after release is published (verifies CI passed)
    # workflow_dispatch: manual deploy with CI verification
    if: |
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment:
      name: production
      url: https://rental-studio.bitcraftapps.dev

    steps:
      - name: Verify CI passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Resolve the commit SHA to verify CI against
          if [ "${{ github.event_name }}" = "release" ]; then
            # Use commits endpoint - works for both lightweight and annotated tags
            TARGET_SHA=$(gh api repos/${{ github.repository }}/commits/${{ github.event.release.tag_name }} --jq '.sha')
            echo "Resolved tag ${{ github.event.release.tag_name }} to commit ${TARGET_SHA}"
          else
            TARGET_SHA="${{ inputs.ref || github.sha }}"
          fi
          echo "Verifying CI has passed for commit ${TARGET_SHA}..."

          # Wait up to 5 minutes for CI to complete if still running
          for i in {1..30}; do
            RESULT=$(gh run list --workflow=CI --commit="${TARGET_SHA}" --limit=1 --json conclusion \
              | jq -r '.[0].conclusion // empty')

            if [ -z "$RESULT" ]; then
              echo "CI run not found yet, waiting... (attempt $i/30)"
              sleep 10
              continue
            fi

            if [ "$RESULT" = "success" ]; then
              echo "CI passed for this commit"
              exit 0
            elif [ "$RESULT" = "failure" ] || [ "$RESULT" = "cancelled" ]; then
              echo "CI failed or was cancelled for this commit"
              exit 1
            fi

            echo "CI still running (status: $RESULT), waiting... (attempt $i/30)"
            sleep 10
          done
          echo "Timeout waiting for CI to complete"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.ref || github.sha }}

      - name: Log deployment info
        run: |
          echo "Deploying to: production"
          echo "Commit: $(git rev-parse HEAD)"
          echo "Commit message: $(git log -1 --format='%s')"
          echo "Triggered by: ${{ github.event_name }}"
          echo "Release tag: ${{ github.event.release.tag_name || 'N/A' }}"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DOKKU_SSH_KEY }}" > ~/.ssh/dokku_deploy
          chmod 600 ~/.ssh/dokku_deploy
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Dokku (Production)
        run: |
          git remote add dokku dokku@${{ secrets.HETZNER_HOST }}:rental-studio
          GIT_SSH_COMMAND="ssh -i ~/.ssh/dokku_deploy" git push dokku HEAD:main --force
